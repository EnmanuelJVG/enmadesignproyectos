<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ENMA Studio Manager</title>
<meta name="description" content="Panel privado de Enma Design: clientes, trabajos, modificaciones, calendario y finanzas.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f4f5f5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ENMA Studio">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet"></noscript>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="splash" aria-hidden="true"><img src="assets/isotipo-blanco.png" alt=""></div>

<aside class="side" aria-label="Menú principal">
  <a class="brand" href="#/hoy" aria-label="ENMA Design, ir al inicio"><img src="assets/logo-blanco.png" alt="Enma Design"></a>
  <a class="nav-i" data-nav="hoy" href="#/hoy"><span data-ic="home"></span>Hoy</a>
  <a class="nav-i" data-nav="clientes" href="#/clientes"><span data-ic="users"></span>Clientes</a>
  <a class="nav-i" data-nav="trabajos" href="#/trabajos"><span data-ic="briefcase"></span>Trabajos</a>
  <a class="nav-i" data-nav="cambios" href="#/cambios"><span data-ic="chat"></span>Modificaciones</a>
  <a class="nav-i" data-nav="calendario" href="#/calendario"><span data-ic="calendar"></span>Calendario</a>
  <a class="nav-i" data-nav="finanzas" href="#/finanzas"><span data-ic="wallet"></span>Finanzas</a>
  <a class="nav-i" data-nav="ajustes" href="#/ajustes"><span data-ic="sliders"></span>Ajustes</a>
  <a class="sync-chip" id="sync-side" href="#/ajustes" hidden></a>
  <p class="side-foot">Solo para mi estudio</p>
</aside>

<header class="top">
  <a class="top-brand" href="#/hoy" aria-label="Ir al inicio"><img class="lg-light" src="assets/isotipo-negro.png" alt="Enma Design"><img class="lg-dark" src="assets/isotipo-blanco.png" alt=""></a>
  <nav class="top-act" aria-label="Más secciones">
    <a class="sync-top" id="sync-top" href="#/ajustes" hidden></a>
    <a data-nav="finanzas" href="#/finanzas" aria-label="Finanzas"><span data-ic="wallet"></span></a>
    <a data-nav="ajustes" href="#/ajustes" aria-label="Ajustes"><span data-ic="sliders"></span></a>
  </nav>
</header>

<nav class="tabbar" aria-label="Navegación">
  <a data-nav="hoy" href="#/hoy"><span data-ic="home"></span>Hoy</a>
  <a data-nav="clientes" href="#/clientes"><span data-ic="users"></span>Clientes</a>
  <a data-nav="trabajos" href="#/trabajos"><span data-ic="briefcase"></span>Trabajos</a>
  <a data-nav="cambios" href="#/cambios"><span data-ic="chat"></span>Cambios</a>
  <a data-nav="calendario" href="#/calendario"><span data-ic="calendar"></span>Agenda</a>
</nav>

<main id="main" class="main" tabindex="-1" aria-live="polite"></main>
<div id="fab-root" class="fab-root"></div>
<div id="modal-root"></div>
<div id="toast-root" aria-live="polite"></div>

<noscript><p style="padding:24px;font-family:sans-serif">Esta aplicación necesita JavaScript para funcionar. Actívalo en tu navegador.</p></noscript>

<script src="js/core.js"></script>
<script src="js/ui.js"></script>
<script src="js/views.js"></script>
<script src="js/views2.js"></script>
<script src="js/forms.js"></script>
<script src="js/cloud-vercel.js"></script>
<script src="js/sync.js"></script>
<script src="js/app.js"></script>
</body>
</html>
