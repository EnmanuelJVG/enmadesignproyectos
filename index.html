<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101313"><title>ENMA DESIGN — Studio Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="assets/enma-isotipo-black.webp">
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
:root{--bg:#f5f7f7;--surface:#fff;--ink:#111615;--muted:#737d7b;--line:#e5ebea;--accent:#11dcca;--accent-soft:#e5fbf8;--dark:#101615;--danger:#d94b5b;--warning:#d58b24;--success:#168b70;--shadow:0 10px 35px #12211b0a;--radius:18px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "DM Sans",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}h1,h2,h3,.brand-name{font-family:Manrope,sans-serif;letter-spacing:-.035em}h1{font-size:clamp(25px,3vw,34px);margin:0;font-weight:800}h2{font-size:17px;margin:0 0 14px}h3{font-size:14px;margin:0}.muted,.sub{color:var(--muted)}.sub{margin:5px 0 24px}.hidden{display:none!important}
.shell{min-height:100vh;display:grid;grid-template-columns:248px minmax(0,1fr)}aside{background:var(--dark);color:#fff;padding:25px 16px;display:flex;flex-direction:column;gap:20px;position:sticky;top:0;height:100vh}.brand{display:flex;align-items:center;gap:11px;padding:0 10px 16px;border-bottom:1px solid #ffffff16}.brand img{width:42px;height:42px;object-fit:contain}.brand-name{font-weight:800;font-size:15px;line-height:1.1}.brand-name small{display:block;font:600 9px "DM Sans";letter-spacing:.19em;color:#9ca9a6;margin-top:5px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#aab5b2;border-radius:12px;padding:11px 12px;text-align:left;display:flex;align-items:center;gap:12px;font-weight:600;transition:.2s}.nav button:hover,.nav button.active{background:#ffffff12;color:white}.nav button.active .ni{color:var(--accent)}.ni{width:20px;text-align:center;font-size:17px}.side-bottom{margin-top:auto;color:#82908c;font-size:12px;padding:10px}
main{padding:30px clamp(18px,3vw,42px) 60px;max-width:1600px;width:100%;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}.top-right{display:flex;align-items:center;gap:10px}.avatar{width:38px;height:38px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center;font-weight:800}.eyebrow{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:700}
.btn{border:0;border-radius:12px;padding:10px 15px;background:var(--dark);color:white;font-weight:700;display:inline-flex;align-items:center;gap:8px;justify-content:center}.btn:hover{filter:brightness(1.13)}.btn.primary{background:var(--accent);color:#08221f}.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}.btn.danger{background:#fff0f1;color:var(--danger)}.btn.small{padding:7px 10px;font-size:12px}.iconbtn{border:1px solid var(--line);background:white;border-radius:11px;padding:9px 11px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:19px;box-shadow:var(--shadow);min-width:0}.metric{display:flex;justify-content:space-between;align-items:flex-start}.metric .symbol{width:34px;height:34px;border-radius:11px;background:var(--accent-soft);display:grid;place-items:center;font-size:16px}.metric .value{font:800 27px Manrope;margin-top:13px;letter-spacing:-.05em}.metric .label{color:var(--muted);font-size:12px;font-weight:600}.section-grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(280px,.8fr);gap:14px;margin-top:15px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th{text-align:left;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:11px;border-bottom:1px solid var(--line)}td{padding:12px 11px;border-bottom:1px solid #eff2f1;font-size:13px}tr:last-child td{border-bottom:0}.badge{display:inline-flex;align-items:center;padding:5px 9px;border-radius:99px;font-size:11px;font-weight:700;background:#eef2f1;color:#53605d}.badge.green{background:#e6f7f1;color:#168b70}.badge.orange{background:#fff4e3;color:#a66a0d}.badge.red{background:#fff0f1;color:#c53c4c}.badge.teal{background:#e4fbf8;color:#087e73}
.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:0 0 15px}.field,select,textarea{border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 12px;color:var(--ink);outline:none;min-width:0}.field:focus,select:focus,textarea:focus{border-color:#55dccc;box-shadow:0 0 0 3px #65f4e426}.search{min-width:220px;flex:1}.empty{padding:35px 16px;text-align:center;color:var(--muted)}.empty b{display:block;color:var(--ink);font:700 16px Manrope;margin-bottom:5px}
.progress{height:7px;background:#edf1f0;border-radius:20px;overflow:hidden}.progress span{display:block;height:100%;background:var(--accent);border-radius:20px}.itemline{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.itemline:last-child{border:0}
.calendar-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:15px}.cal{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--line);border-radius:14px;overflow:hidden}.cal>div{min-height:104px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px}.cal>div:nth-child(7n){border-right:0}.cal .dow{min-height:auto;background:#f7f9f8;color:var(--muted);font-size:10px;text-transform:uppercase;font-weight:800}.daynum{font-weight:700;font-size:12px}.daynum.today{background:var(--accent);border-radius:50%;padding:3px 7px}.event{display:block;margin-top:5px;border-radius:6px;padding:4px 5px;background:var(--accent-soft);color:#126d64;font-size:10px;white-space:normal;line-height:1.25;overflow:hidden}.event.task{background:#fff3e2;color:#96600f}.event.project{background:#eef0ff;color:#5554a5}
.modal{position:fixed;inset:0;background:#07100f80;z-index:20;display:grid;place-items:center;padding:16px}.modalbox{background:white;border-radius:20px;padding:23px;width:min(620px,100%);max-height:90vh;overflow:auto;box-shadow:0 25px 80px #0003}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:17px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.formgrid label{display:grid;gap:5px;color:var(--muted);font-size:12px;font-weight:600}.formgrid .wide{grid-column:1/-1}.formgrid input,.formgrid select,.formgrid textarea{width:100%}.modalfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#14201d;color:white;padding:12px 17px;border-radius:12px;z-index:40;box-shadow:var(--shadow);max-width:90vw}

.mobilebar{display:none}
@media(max-width:1050px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.section-grid{grid-template-columns:1fr}}
@media(max-width:720px){.shell{display:block}aside{position:fixed;z-index:15;top:auto;bottom:0;left:0;right:0;width:100%;height:auto;padding:7px 6px calc(7px + env(safe-area-inset-bottom));display:block}.brand,.side-bottom{display:none}.nav{display:flex;justify-content:space-around;gap:2px}.nav button{flex:1;flex-direction:column;gap:2px;padding:7px 2px;font-size:9px;border-radius:9px}.ni{font-size:16px}main{padding:20px 14px 100px}.top{align-items:flex-start}.grid{gap:9px}.card{padding:14px;border-radius:15px}.metric .value{font-size:22px}.metric .symbol{width:29px;height:29px}.formgrid{grid-template-columns:1fr}.formgrid .wide{grid-column:auto}.cal>div{min-height:76px;padding:4px}.event{font-size:9px;padding:3px}.dow{font-size:8px!important}.toolbar .search{min-width:100%}.toolbar>*{flex:1}.top-right .topemail{display:none}}
@media print{aside,.top-right,#exportbar,.toolbar button,.btn{display:none!important}.shell{display:block}main{padding:0;max-width:none}.card{box-shadow:none;break-inside:avoid}body{background:white}}
</style></head>
<body>
<div id="app"></div><div id="modal" class="modal hidden"><div class="modalbox" id="modalbox"></div></div><div id="toast" class="toast hidden"></div>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TABLES=['clients','brands','projects','tasks','payments','expenses','calendar_events','corrections'];
const api=async(method='GET',body=null)=>{const r=await fetch('/api/data',{method,headers:{'Content-Type':'application/json'},...(body?{body:JSON.stringify(body)}:{})});const j=await r.json().catch(()=>({error:'Respuesta inválida del servidor'}));if(!r.ok)throw new Error(j.error||'Error de conexión');return j};
let db={}; const persist=async()=>{await api('PUT',db)};
const sb={from:(table)=>{let mode='select',payload=null,id=null;const q={select(){return q},order(){return q},limit(){return q},insert(d){mode='insert';payload=d;return q},update(d){mode='update';payload=d;return q},delete(){mode='delete';return q},eq(k,v){if(k==='id')id=v;return q},single:async()=>{const r=await q.exec();return {data:r.data?.[0]||null,error:r.error}},exec:async()=>{try{if(mode==='select')return {data:db[table]||[],error:null};if(mode==='insert'){const rows=(Array.isArray(payload)?payload:[payload]).map(x=>({id:crypto.randomUUID(),created_at:new Date().toISOString(),...x}));db[table]=[...(db[table]||[]),...rows];await persist();return {data:rows,error:null}}if(mode==='update'){db[table]=(db[table]||[]).map(x=>x.id===id?{...x,...payload,updated_at:new Date().toISOString()}:x);await persist();return {data:null,error:null}}if(mode==='delete'){db[table]=(db[table]||[]).filter(x=>x.id!==id);await persist();return {data:null,error:null}}}catch(e){return {data:null,error:{message:e.message}}}}};q.then=(resolve,reject)=>q.exec().then(resolve,reject);return q;}};

const state={page:'dashboard',clients:[],brands:[],projects:[],tasks:[],payments:[],expenses:[],events:[],corrections:[],month:new Date(),search:'',filter:'',rate:null};
const nav=[['dashboard','▦','Resumen'],['clients','♙','Clientes'],['brands','✳','Marcas'],['projects','▣','Proyectos'],['tasks','☷','Tareas'],['calendar','▦','Calendario'],['finance','＄','Finanzas']];
const money=n=>'$'+Number(n||0).toLocaleString('es-VE',{minimumFractionDigits:2,maximumFractionDigits:2});
const dateFmt=s=>s?new Date(s+'T12:00:00').toLocaleDateString('es-VE',{day:'2-digit',month:'short',year:'numeric'}):'—';
const today=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
const statusClass=s=>/Finalizado|Entregado|Recibido|Completada/.test(s)?'green':/Cancelado|Vencida/.test(s)?'red':/revisión|modificaciones|pendiente|proceso|aprobación/i.test(s)?'orange':'teal';
const badge=s=>`<span class="badge ${statusClass(s)}">${esc(s||'Sin estado')}</span>`;
function toast(s){let t=$('#toast');t.textContent=s;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),3000)}
function layout(){ $('#app').innerHTML=`<div class="shell"><aside><div class="brand"><img src="assets/enma-isotipo-white.webp"><div class="brand-name">ENMA DESIGN<small>STUDIO MANAGER</small></div></div><nav class="nav">${nav.map(([id,ic,label])=>`<button data-page="${id}" class="${state.page===id?'active':''}"><span class="ni">${ic}</span>${label}</button>`).join('')}</nav><div class="side-bottom">Uso personal · ENMA DESIGN</div></aside><main><div class="top"><div><div class="eyebrow">TU ESTUDIO CREATIVO</div><h1>${nav.find(x=>x[0]===state.page)?.[2]||'Resumen'}</h1><p class="sub" style="margin-bottom:0">${new Date().toLocaleDateString('es-VE',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</p></div><div class="top-right"><button class="iconbtn" id="refresh" title="Actualizar">↻</button><span class="topemail muted">Acceso directo</span><div class="avatar">E</div></div></div><div id="content"></div></main></div>`;
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{state.page=b.dataset.page;render()});$('#refresh').onclick=loadData;render();}
function metric(label,value,symbol){return `<div class="card"><div class="metric"><div class="label">${label}</div><div class="symbol">${symbol}</div></div><div class="value">${value}</div></div>`}
function dashboard(){let active=state.projects.filter(p=>!['Finalizado','Entregado','Cancelado'].includes(p.status)).length,late=state.projects.filter(p=>p.due_date&&p.due_date<today()&&!['Finalizado','Entregado','Cancelado'].includes(p.status)).length,received=state.payments.filter(p=>p.status==='Recibido').reduce((a,p)=>a+Number(p.amount_usd||0),0),pending=state.payments.filter(p=>p.status==='Pendiente').reduce((a,p)=>a+Number(p.amount_usd||0),0),expenses=state.expenses.reduce((a,p)=>a+Number(p.amount_usd||0),0);
return `<div class="grid">${metric('Clientes registrados',state.clients.length,'♙')}${metric('Proyectos activos',active,'▣')}${metric('Entregas vencidas',late,'!')}${metric('Ingresos recibidos',money(received),'＄')}</div><div class="section-grid"><div class="card"><div class="section-head"><h2>Actividad próxima</h2><button class="btn ghost small" data-go="calendar">Ver calendario →</button></div>${[...state.tasks.filter(t=>t.status!=='Completada'&&t.due_date),...state.projects.filter(p=>p.due_date&&!['Finalizado','Entregado','Cancelado'].includes(p.status)).map(p=>({title:p.name,due_date:p.due_date,status:p.status,kind:'Proyecto'}))].sort((a,b)=>a.due_date.localeCompare(b.due_date)).slice(0,7).map(t=>`<div class="itemline"><div><b>${esc(t.title||t.name)}</b><div class="muted" style="font-size:11px">${esc(t.kind||'Tarea')}</div></div><div style="text-align:right">${dateFmt(t.due_date)}</div></div>`).join('')||'<div class="empty">No hay entregas próximas registradas.</div>'}</div><div class="card"><h2>Resumen financiero</h2><div class="itemline"><span class="muted">Cobrado</span><b>${money(received)}</b></div><div class="itemline"><span class="muted">Por cobrar</span><b>${money(pending)}</b></div><div class="itemline"><span class="muted">Gastos</span><b>${money(expenses)}</b></div><div class="itemline"><span class="muted">Balance neto</span><b>${money(received-expenses)}</b></div><p class="muted" style="font-size:11px;margin:12px 0 0">Cifras calculadas desde los registros de tu estudio.</p></div></div><div class="card" style="margin-top:15px"><div class="section-head"><h2>Proyectos recientes</h2><button class="btn ghost small" data-go="projects">Ver proyectos →</button></div>${table(['Proyecto','Cliente','Entrega','Estado'],state.projects.slice(0,6).map(p=>`<tr><td><b>${esc(p.name)}</b></td><td>${esc(clientName(p.client_id))}</td><td>${dateFmt(p.due_date)}</td><td>${badge(p.status)}</td></tr>`).join(''))}</div>`}
function clientName(id){return state.clients.find(c=>c.id===id)?.name||'—'}
function table(head,rows){return `<div class="table-wrap"><table><thead><tr>${head.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows||''}</tbody></table></div>`}
function actions(type,id){return `<td><button class="btn ghost small" data-edit="${type}" data-id="${id}">Editar</button> <button class="btn danger small" data-delete="${type}" data-id="${id}">×</button></td>`}
function listPage(type){let rows=[],heads=[];
if(type==='clients'){heads=['Cliente','Contacto','Correo','WhatsApp','Estado',''];rows=state.clients.filter(x=>matches(x.name,x.contact_name,x.email)).map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${esc(x.contact_name)}</td><td>${esc(x.email)}</td><td>${esc(x.whatsapp)}</td><td>${badge(x.status)}</td>${actions('clients',x.id)}</tr>`)}
if(type==='brands'){heads=['Marca','Cliente','Web','Instagram','Recursos',''];rows=state.brands.filter(x=>matches(x.name,x.description)).map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${esc(clientName(x.client_id))}</td><td>${esc(x.website)}</td><td>${esc(x.instagram)}</td><td>${x.logo_path?`<a href="${esc(x.logo_path)}" target="_blank" rel="noopener">Logo</a>`:''} ${x.brand_guide_path?`<a href="${esc(x.brand_guide_path)}" target="_blank" rel="noopener">Manual</a>`:''}</td>${actions('brands',x.id)}</tr>`)}
if(type==='projects'){heads=['Proyecto','Cliente','Categoría','Entrega','Precio USD','Estado','Historial',''];rows=state.projects.filter(x=>matches(x.name,x.category,x.status,clientName(x.client_id))).map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${esc(clientName(x.client_id))}</td><td>${esc(x.category)}</td><td>${dateFmt(x.due_date)}</td><td>${money(x.agreed_usd)}</td><td>${badge(x.status)}</td><td><button class="btn ghost small" data-corrections="${x.id}">Correcciones (${state.corrections.filter(c=>c.project_id===x.id).length})</button></td>${actions('projects',x.id)}</tr>`)}
if(type==='tasks'){heads=['Tarea','Proyecto','Fecha límite','Prioridad','Estado',''];rows=state.tasks.filter(x=>matches(x.title,x.status)).map(x=>`<tr><td><b>${esc(x.title)}</b></td><td>${esc(state.projects.find(p=>p.id===x.project_id)?.name||'—')}</td><td>${dateFmt(x.due_date)}</td><td>${esc(x.priority)}</td><td>${badge(x.status)}</td>${actions('tasks',x.id)}</tr>`)}
return `<div class="toolbar"><input class="field search" id="search" placeholder="Buscar..." value="${esc(state.search)}"><button class="btn primary" id="add">＋ Nuevo ${type==='clients'?'cliente':type==='brands'?'marca':type==='projects'?'proyecto':'tarea'}</button></div><div class="card">${rows.length?table(heads,rows):'<div class="empty"><b>Aún no hay registros</b>Agrega tu primer elemento para comenzar a organizar el estudio.</div>'}</div>`}
function matches(...a){return !state.search||a.join(' ').toLowerCase().includes(state.search.toLowerCase())}
const statuses=['Solicitud recibida','Cotización pendiente','Esperando aprobación','Aprobado','En proceso','En revisión del cliente','Requiere modificaciones','Aprobado para entrega','Entregado','Finalizado','Cancelado'];
const cats=['Diseño de logotipos','Branding e identidad visual','Diseño para redes sociales','Flyers publicitarios','Diseño de publicaciones','Diseño de menús','Diseño de páginas web','Edición de videos','Motion graphics','Animaciones','Publicidad digital','Otros'];
function openForm(type,id){let data=id?state[type].find(x=>x.id===id)||{}:{},fields=[];
const add=(k,label,t='text',opts=null,wide=false)=>fields.push({k,label,t,opts,wide});
if(type==='clients'){add('name','Nombre de empresa o cliente','text',null,true);add('contact_name','Contacto principal');add('email','Correo','email');add('whatsapp','WhatsApp');add('city','País y ciudad');add('instagram','Instagram');add('website','Página web');add('description','Descripción / notas','textarea',null,true);add('status','Estado','select',['Activo','Archivado'])}
if(type==='brands'){add('name','Nombre de la marca');add('client_id','Cliente','select',state.clients.map(x=>[x.id,x.name]));add('website','Página web');add('instagram','Instagram');add('facebook','Facebook');add('tiktok','TikTok');add('colors','Colores HEX (separados por coma)');add('typography','Tipografías');add('logo_path','Enlace al logotipo');add('brand_guide_path','Enlace al manual PDF');add('description','Descripción / personalidad de marca','textarea',null,true)}
if(type==='projects'){add('name','Nombre del proyecto','text',null,true);add('client_id','Cliente','select',state.clients.map(x=>[x.id,x.name]));add('brand_id','Marca','select',state.brands.map(x=>[x.id,x.name]));add('category','Categoría','select',cats);add('status','Estado','select',statuses);add('priority','Prioridad','select',['Alta','Media','Baja']);add('start_date','Fecha de inicio','date');add('due_date','Fecha de entrega','date');add('agreed_usd','Precio acordado (USD)','number');add('description','Brief / observaciones','textarea',null,true)}
if(type==='tasks'){add('title','Nombre de la tarea','text',null,true);add('project_id','Proyecto','select',state.projects.map(x=>[x.id,x.name]));add('due_date','Fecha límite','date');add('priority','Prioridad','select',['Alta','Media','Baja']);add('status','Estado','select',['Pendiente','En proceso','Completada']);add('description','Detalles','textarea',null,true)}
let form=`<div class="modalhead"><h2>${id?'Editar':'Crear'} ${type==='clients'?'cliente':type==='brands'?'marca':type==='projects'?'proyecto':'tarea'}</h2><button class="iconbtn" id="xmodal">✕</button></div><form id="recordform"><div class="formgrid">${fields.map(f=>`<label class="${f.wide?'wide':''}">${f.label}${f.t==='select'?`<select name="${f.k}"><option value="">Seleccionar...</option>${(f.opts||[]).map(o=>{let v=Array.isArray(o)?o[0]:o,l=Array.isArray(o)?o[1]:o;return `<option value="${esc(v)}" ${v===data[f.k]?'selected':''}>${esc(l)}</option>`}).join('')}</select>`:f.t==='textarea'?`<textarea name="${f.k}" rows="3">${esc(data[f.k]||'')}</textarea>`:f.t==='file'?`<input name="${f.k}" type="file" accept="${f.k==='brand_guide_file'?'.pdf,application/pdf':'image/png,image/jpeg,image/webp'}">`: `<input name="${f.k}" type="${f.t}" value="${esc(data[f.k]??'')}" ${['name','title'].includes(f.k)?'required':''} ${f.t==='number'?'min="0" step="0.01"':''}>` }</label>`).join('')}</div><div class="modalfoot"><button type="button" class="btn ghost" id="cancelmodal">Cancelar</button><button class="btn primary">Guardar en la base de datos</button></div></form>`;
$('#modalbox').innerHTML=form;$('#modal').classList.remove('hidden');$('#xmodal').onclick=$('#cancelmodal').onclick=()=>$('#modal').classList.add('hidden');
$('#recordform').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target);let d=Object.fromEntries([...fd.entries()]);Object.keys(d).forEach(k=>{if(d[k]==='')d[k]=null});if(type==='projects')d.agreed_usd=Number(d.agreed_usd||0);let recordId=id;if(id){let result=await sb.from(type).update(d).eq('id',id);if(result.error)return toast(result.error.message)}else{let result=await sb.from(type).insert(d).select('id').single();if(result.error)return toast(result.error.message);recordId=result.data.id}$('#modal').classList.add('hidden');toast('Registro guardado correctamente.');await loadData();};}
function calendar(){let d=state.month,y=d.getFullYear(),m=d.getMonth(),first=new Date(y,m,1),start=new Date(y,m,1-first.getDay()),days=42,ev=[...state.tasks.filter(t=>t.due_date).map(t=>({...t,label:t.title,kind:'task'})),...state.projects.filter(p=>p.due_date).map(p=>({...p,label:p.name,kind:'project'})),...state.events.map(e=>({...e,label:e.title,kind:'event'}))];return `<div class="card"><div class="calendar-head"><div><h2>${d.toLocaleDateString('es-VE',{month:'long',year:'numeric'})}</h2><div class="muted" style="font-size:12px">Fechas de entrega, tareas y eventos del estudio</div></div><div><button class="btn ghost small" id="prev">←</button> <button class="btn ghost small" id="today">Hoy</button> <button class="btn ghost small" id="next">→</button> <button class="btn primary small" id="addevent">＋ Evento</button></div></div><div class="cal">${['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'].map(x=>`<div class="dow">${x}</div>`).join('')}${Array.from({length:days},(_,i)=>{let date=new Date(start);date.setDate(start.getDate()+i);let iso=[date.getFullYear(),String(date.getMonth()+1).padStart(2,'0'),String(date.getDate()).padStart(2,'0')].join('-'),items=ev.filter(e=>e.due_date===iso);return `<div style="${date.getMonth()!==m?'background:#fafbfb':''}"><span class="daynum ${iso===today()?'today':''}">${date.getDate()}</span>${items.slice(0,3).map(e=>`<span class="event ${e.kind}" title="${esc(e.label)}">${esc(e.label)}</span>`).join('')}${items.length>3?`<small>+${items.length-3} más</small>`:''}</div>`}).join('')}</div><p class="muted" style="font-size:11px;margin:12px 0 0">Azul: proyectos · Turquesa: eventos · Naranja: tareas. Las fechas provienen de los registros guardados.</p></div>`}
function finance(){let rec=state.payments.filter(p=>p.status==='Recibido').reduce((a,p)=>a+Number(p.amount_usd||0),0),pend=state.payments.filter(p=>p.status==='Pendiente').reduce((a,p)=>a+Number(p.amount_usd||0),0),exp=state.expenses.reduce((a,p)=>a+Number(p.amount_usd||0),0);return `<div class="grid">${metric('Cobrado',money(rec),'＄')}${metric('Por cobrar',money(pend),'◷')}${metric('Gastos',money(exp),'↘')}${metric('Balance neto',money(rec-exp),'↗')}</div><div class="section-grid"><div class="card"><div class="section-head"><h2>Ingresos y pagos</h2><button class="btn primary small" id="addpayment">＋ Registrar pago</button></div>${table(['Fecha','Concepto','Importe USD','Estado'],state.payments.map(p=>`<tr><td>${dateFmt(p.paid_at)}</td><td>${esc(p.description)}</td><td>${money(p.amount_usd)}</td><td>${badge(p.status)}</td></tr>`).join(''))||'<div class="empty">Sin pagos registrados.</div>'}</div><div class="card"><div class="section-head"><h2>Gastos</h2><button class="btn primary small" id="addexpense">＋ Registrar gasto</button></div>${table(['Fecha','Concepto','Importe'],state.expenses.map(p=>`<tr><td>${dateFmt(p.spent_at)}</td><td>${esc(p.description)}</td><td>${money(p.amount_usd)}</td></tr>`).join(''))}</div></div><p class="muted" style="font-size:11px;margin-top:12px">Los importes se consolidan en USD. Para operaciones en VES, convierte usando la tasa aplicada y conserva el monto original en la descripción o comprobante.</p>`}
function render(){let el=$('#content');if(state.page==='dashboard')el.innerHTML=dashboard();else if(['clients','brands','projects','tasks'].includes(state.page))el.innerHTML=listPage(state.page);else if(state.page==='calendar')el.innerHTML=calendar();else if(state.page==='finance')el.innerHTML=finance();
el.insertAdjacentHTML('afterbegin',`<div class="toolbar" id="exportbar"><button class="btn ghost small" data-export="csv">↓ Excel / CSV</button><button class="btn ghost small" data-export="doc">↓ Word</button><button class="btn ghost small" data-export="pdf">↓ PDF / Imprimir</button><button class="btn ghost small" data-export="image">↓ Imagen</button><button class="btn ghost small" data-export="copy">Copiar texto</button></div>`);
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{state.page=b.dataset.go;render()});
let s=$('#search');if(s)s.oninput=e=>{state.search=e.target.value;let pos=e.target.selectionStart;render();let n=$('#search');n.focus();n.setSelectionRange(pos,pos)};
let add=$('#add');if(add)add.onclick=()=>openForm(state.page);
document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openForm(b.dataset.edit,b.dataset.id));
document.querySelectorAll('[data-corrections]').forEach(b=>b.onclick=()=>correctionForm(b.dataset.corrections));
if($('#exportbar'))bindExports();
document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>removeRecord(b.dataset.delete,b.dataset.id));

if($('#prev'))$('#prev').onclick=()=>{state.month=new Date(state.month.getFullYear(),state.month.getMonth()-1,1);render()};
if($('#next'))$('#next').onclick=()=>{state.month=new Date(state.month.getFullYear(),state.month.getMonth()+1,1);render()};
if($('#today'))$('#today').onclick=()=>{state.month=new Date();render()};
if($('#addevent'))$('#addevent').onclick=()=>eventForm();
if($('#addpayment'))$('#addpayment').onclick=()=>paymentForm();
if($('#addexpense'))$('#addexpense').onclick=()=>expenseForm();}
async function removeRecord(type,id){if(!confirm('¿Eliminar este registro? Esta acción no se puede deshacer.'))return;let {error}=await sb.from(type).delete().eq('id',id);if(error)return toast(error.message);toast('Registro eliminado.');loadData()}
function eventForm(){simpleForm('Nuevo evento',[['title','Título','text'],['due_date','Fecha','date'],['description','Descripción','textarea']],async d=>{let {error}=await sb.from('calendar_events').insert(d);if(error)return toast(error.message);$('#modal').classList.add('hidden');loadData()})}
function paymentForm(){simpleForm('Registrar pago',[['description','Concepto','text'],['amount_usd','Importe en USD','number'],['paid_at','Fecha','date'],['status','Estado (Recibido/Pendiente)','text']],async d=>{d.amount_usd=Number(d.amount_usd);let {error}=await sb.from('payments').insert(d);if(error)return toast(error.message);$('#modal').classList.add('hidden');loadData()})}
function expenseForm(){simpleForm('Registrar gasto',[['description','Concepto','text'],['amount_usd','Importe en USD','number'],['spent_at','Fecha','date']],async d=>{d.amount_usd=Number(d.amount_usd);let {error}=await sb.from('expenses').insert(d);if(error)return toast(error.message);$('#modal').classList.add('hidden');loadData()})}
function simpleForm(title,fields,save){$('#modalbox').innerHTML=`<div class="modalhead"><h2>${title}</h2><button class="iconbtn" id="xmodal">✕</button></div><form id="simpleform"><div class="formgrid">${fields.map(([k,l,t])=>`<label class="${t==='textarea'?'wide':''}">${l}${t==='textarea'?`<textarea name="${k}" required></textarea>`:`<input name="${k}" type="${t}" ${t==='date'?'value="'+today()+'"':''} required ${t==='number'?'min="0" step="0.01"':''}>`}</label>`).join('')}</div><div class="modalfoot"><button type="button" class="btn ghost" id="cancelmodal">Cancelar</button><button class="btn primary">Guardar</button></div></form>`;$('#modal').classList.remove('hidden');$('#xmodal').onclick=$('#cancelmodal').onclick=()=>$('#modal').classList.add('hidden');$('#simpleform').onsubmit=async e=>{e.preventDefault();await save(Object.fromEntries(new FormData(e.target)))}}
async function loadData(){try{db=await api('GET');for(const t of TABLES)db[t]=db[t]||[];state.clients=db.clients;state.brands=db.brands;state.projects=db.projects;state.tasks=db.tasks;state.payments=db.payments;state.expenses=db.expenses;state.events=db.calendar_events;state.corrections=db.corrections;render()}catch(e){toast(e.message)}}
async function start(){layout();await loadData()}
function correctionForm(projectId){const p=state.projects.find(x=>x.id===projectId);const items=state.corrections.filter(x=>x.project_id===projectId).sort((a,b)=>(b.date||'').localeCompare(a.date||''));$('#modalbox').innerHTML=`<div class="modalhead"><div><h2>Historial de correcciones</h2><div class="muted">${esc(p?.name||'Proyecto')}</div></div><button class="iconbtn" id="xmodal">✕</button></div><div>${items.map(c=>`<div class="itemline"><div><b>${dateFmt(c.date)}</b><div style="white-space:pre-wrap;margin-top:4px">${esc(c.details)}</div></div><button class="btn danger small" data-del-correction="${c.id}">Eliminar</button></div>`).join('')||'<div class="empty">Todavía no hay correcciones registradas.</div>'}</div><form id="correctionform" style="margin-top:18px"><div class="formgrid"><label>Fecha<input name="date" type="date" value="${today()}" required></label><label class="wide">¿Qué se corrigió o realizó?<textarea name="details" rows="4" required placeholder="Describe los cambios solicitados y el trabajo realizado..."></textarea></label></div><div class="modalfoot"><button class="btn primary">＋ Añadir al historial</button></div></form>`;$('#modal').classList.remove('hidden');$('#xmodal').onclick=()=>$('#modal').classList.add('hidden');$('#correctionform').onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));d.project_id=projectId;let r=await sb.from('corrections').insert(d);if(r.error)return toast(r.error.message);$('#modal').classList.add('hidden');toast('Corrección registrada');await loadData();};document.querySelectorAll('[data-del-correction]').forEach(b=>b.onclick=async()=>{if(!confirm('¿Eliminar esta corrección?'))return;let r=await sb.from('corrections').delete().eq('id',b.dataset.delCorrection);if(r.error)return toast(r.error.message);await loadData();correctionForm(projectId)})}
function exportRows(){const keys={clients:['name','contact_name','email','whatsapp','city','instagram','website','description','status'],brands:['name','client_id','website','instagram','facebook','tiktok','colors','typography','description'],projects:['name','client_id','category','status','priority','start_date','due_date','agreed_usd','description'],tasks:['title','project_id','due_date','priority','status','description'],finance:['description','amount_usd','status','paid_at','spent_at','notes'],calendar:['title','due_date','description'],dashboard:['name','status','due_date','agreed_usd']};let k=keys[state.page]||keys.dashboard;let rows=state.page==='finance'?[...state.payments,...state.expenses]:state.page==='calendar'?state.events:state.page==='dashboard'?state.projects:state[state.page]||[];return {k,rows}}
function bindExports(){document.querySelectorAll('[data-export]').forEach(b=>b.onclick=async()=>{const {k,rows}=exportRows();const name='enma-'+state.page+'-'+today();const cell=v=>'"'+String(v??'').replace(/"/g,'""')+'"';if(b.dataset.export==='copy'){const t=[k.join('\t'),...rows.map(r=>k.map(x=>r[x]).join('\t'))].join('\n');await navigator.clipboard.writeText(t);toast('Texto copiado');return}if(b.dataset.export==='csv'){const csv='\ufeff'+[k.join(','),...rows.map(r=>k.map(x=>cell(r[x])).join(','))].join('\r\n');download(new Blob([csv],{type:'text/csv;charset=utf-8'}),name+'.csv');return}if(b.dataset.export==='doc'){const html='<html><meta charset="utf-8"><h1>ENMA DESIGNS · '+state.page+'</h1><table border="1"><tr>'+k.map(x=>'<th>'+esc(x)+'</th>').join('')+'</tr>'+rows.map(r=>'<tr>'+k.map(x=>'<td>'+esc(r[x])+'</td>').join('')+'</tr>').join('')+'</table></html>';download(new Blob([html],{type:'application/msword'}),name+'.doc');return}if(b.dataset.export==='pdf'){window.print();return}if(b.dataset.export==='image'){try{const canvas=await html2canvas($('#content'),{backgroundColor:'#f5f7f7',scale:2});canvas.toBlob(blob=>download(blob,name+'.png'));}catch(e){toast('No se pudo generar la imagen')}}})}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();URL.revokeObjectURL(a.href)}
(async()=>{start()})();
</script></body></html>
